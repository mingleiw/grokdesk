; GrokDesk for the Waveshare ESP32-S3-Touch-LCD-4.3B.
; Module is ESP32-S3-WROOM-1-N16R8: 16MB quad flash, 8MB octal PSRAM.
;
; pioarduino 55.03.312 is Arduino-ESP32 3.3.12. The PlatformIO espressif32
; platform still packages Arduino 2.0.17, which has no RGB bounce buffer.
; Screen drift on this panel is why the Waveshare demo sets that buffer.
; memory_type qio_opi matches the Espressif board "Waveshare ESP32-S3-Touch-LCD-4.3B"
; with PSRAM enabled. The image header stays DIO/80MHz.

[env:waveshare43b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOOP_STACK_SIZE=32768
lib_deps =
    moononournation/GFX Library for Arduino@1.6.9
    bblanchon/ArduinoJson@7.4.2
    tzapu/WiFiManager@2.0.17
